{% comment %}
Shared layout for every Sachfitsin email.

Email clients strip <style> blocks and ignore modern CSS, so this is a
table layout with inline styles on purpose. Do not "tidy" it into divs
and classes.

Blocks a child template fills in:
  preheader  - short line shown next to the subject in the inbox
  content    - the body of the email
{% endcomment %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>{{ subject|default:site_name }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f6f3; -webkit-font-smoothing:antialiased;">

<div style="display:none; max-height:0; overflow:hidden; opacity:0;">{% block preheader %}{% endblock %}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f6f3;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px; margin:0 auto;">

        <!-- Brand -->
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <span style="display:inline-block; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:19px; font-weight:600; color:#1f5c44; letter-spacing:-0.2px;">
              {{ site_name }}
            </span>
          </td>
        </tr>

        <!-- Card -->
        <tr>
          <td style="background-color:#ffffff; border:1px solid #dfe9e3; border-radius:16px; padding:36px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:24px; color:#3c4a43;">
                  {% block content %}{% endblock %}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td align="center" style="padding:24px 8px 0;">
            <p style="margin:0 0 8px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:19px; color:#7b8a83;">
              You are receiving this because you have a {{ site_name }} account.
            </p>

            <p style="margin:0 0 8px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:19px; color:#7b8a83;">
              Questions? Reply to this email or write to
              <a href="mailto:{{ support_email }}" style="color:#2f7d5d; text-decoration:none;">{{ support_email }}</a>.
            </p>

            <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:19px; color:#9aa8a1;">
              Guidance here is educational and does not replace medical advice.
            </p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
