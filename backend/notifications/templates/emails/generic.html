{% extends "emails/base.html" %}

{% block preheader %}{{ preheader|default:heading }}{% endblock %}

{% block content %}
  {% include "emails/_heading.html" %}

  <p style="margin:0 0 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:24px; color:#3c4a43;">Hi {{ first_name|default:"there" }},</p>

  <p style="margin:0 0 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:24px; color:#3c4a43;" style="white-space:pre-line;">{{ message }}</p>

  {% if button_url %}
    {% include "emails/_button.html" %}
  {% endif %}
{% endblock %}
