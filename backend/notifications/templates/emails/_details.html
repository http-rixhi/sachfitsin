<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0 4px; background-color:#f5f9f7; border:1px solid #e3ede8; border-radius:12px;">
  {% for label, value in details %}
  <tr>
    <td style="padding:12px 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; color:#7b8a83; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; vertical-align:top; width:40%;">{{ label }}</td>
    <td style="padding:12px 16px 12px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:21px; color:#1c2b24; font-weight:500;">{{ value }}</td>
  </tr>
  {% endfor %}
</table>
